[base]
package = ocean
env_name = puffer_chess
policy_name = Chess
rnn_name = Recurrent

[vec]
backend = Multiprocessing
num_envs = 2

[env]
num_envs = 4096
max_moves = 5000
reward_draw = 0.0
reward_invalid_piece = 0.0
reward_invalid_move = 0.0
reward_valid_piece = 0.0
reward_valid_move = 0.0
reward_material = 0.023450174563228867
reward_position = 0.2007761955680602
reward_castling = 0.0
reward_repetition = -0.21796812626359585
enable_50_move_rule = 1
enable_threefold_repetition = 1
selfplay = 1
human_play = 0
random_bot = 0
fen_file = fens2.txt
fen_curric_pct = 0.5

[policy]
hidden_size = 128
cnn_channels = 64
embed_dim = 32
use_action_masking = 1

[rnn]
input_size = 128
hidden_size = 128

[train]
seed = 42
torch_deterministic = True
device = cuda
optimizer = muon
anneal_lr = True
adam_beta1 = 0.9632058835138869
adam_beta2 = 0.99999
adam_eps = 5.0932585353651185e-8
clip_coef = 0.24434889762336554
ent_coef = 0.06071058967140654
gae_lambda = 0.9104004929204593
gamma = 0.9998817255232597
learning_rate = 0.0005
min_lr_ratio = 0.08691399615981617
total_timesteps = 5_000_000_000
update_epochs = 1
minibatch_size = 16384
bptt_horizon = 128
vf_coef = 2.6407391025068927
vf_clip_coef = 0.8348862769964087
max_grad_norm = 1.7111753771902465
vtrace_rho_clip = 1.6597307346608852
vtrace_c_clip = 2.9060104834647573
prio_alpha = 0.30000000000000004
prio_beta0 = 0.99

[sweep.train.total_timesteps]
distribution = uniform
min = 1_000_000_000
max = 5_000_000_000
mean = 3_000_000_000
scale = auto

[sweep.env.reward_material]
distribution = uniform
min = 0.0
max = 0.1
mean = 0.025
scale = auto

[sweep.env.reward_position]
distribution = uniform
min = 0.0
