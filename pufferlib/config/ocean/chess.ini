[base]
package = ocean
env_name = puffer_chess
policy_name = ChessTwo

[vec]
total_agents = 16384
num_buffers = 8
num_threads = 128

[env]
selfplay = 1
random_bot = 0
stockfish_bot = 1
stockfish_limit_strength = 1
stockfish_elo = 1320
stockfish_movetime_ms = 0
stockfish_depth = 1
stockfish_random_pct = 90
stockfish_query_pct = 100
chess_encoder = 1
max_moves = 5000
enable_threefold_repetition = 1
enable_50_move_rule = 1
reward_draw = -0.3
reward_material = 0.05
reward_check = 0.01
reward_repetition = -0.05
reward_invalid_piece = 0.0
reward_invalid_move = 0.0
fen_curric_pct = 0.5
deepmind_fen_pct = 1.0
reward_tutor_piece = 0.05
reward_tutor_move = 0.15
reward_tutor_wrong = 0.0
tutor_only_mode = 0

[policy]
cnn_channels = 256
hidden_size = 256
embed_dim = 32
use_action_masking = 1

[train]
total_timesteps = 10_000_000_000
horizon = 256
cudagraphs = -1
gamma = 0.9998
gae_lambda = 0.91
ent_coef = 0.02
vf_coef = 2.64
clip_coef = 0.24
vf_clip_coef = 0.83
vtrace_rho_clip = 1.66
vtrace_c_clip = 2.91
