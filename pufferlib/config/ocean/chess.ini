[base]
package = ocean
env_name = puffer_chess
policy_name = ChessResNet
rnn_name = None

[vec]
backend = Multiprocessing
num_envs = 4

[env]
num_envs = 2048
max_moves = 200
reward_draw = -0.05
reward_invalid_piece = 0.0
reward_invalid_move = 0.0
reward_repetition = -0.01
enable_50_move_rule = 1
enable_threefold_repetition = 1
selfplay = 1
human_play = 0
random_bot = 0
fen_file = fens2.txt
fen_file_dm = fens_deepmind.txt
fen_curric_pct = 0.25
deepmind_fen_pct = 0.0

[policy]
hidden_size = 256
channels = 128
num_blocks = 6
meta_hidden = 192
embed_dim = 16
group_norm_groups = 8
use_action_masking = 1

[train]
seed = 42
torch_deterministic = True
device = cuda
optimizer = adam
anneal_lr = True
adam_beta1 = 0.9
adam_beta2 = 0.999
adam_eps = 1e-8
clip_coef = 0.15
ent_coef = 0.002
gae_lambda = 0.97
gamma = 0.999
learning_rate = 0.0003
min_lr_ratio = 0.1
total_timesteps = 50_000_000_000
update_epochs = 2
minibatch_size = 65536
max_minibatch_size = 65536
bptt_horizon = 128
vf_coef = 1.5
vf_clip_coef = 0.5
max_grad_norm = 0.5
vtrace_rho_clip = 1.0
vtrace_c_clip = 1.0
prio_alpha = 0.6
prio_beta0 = 0.4
checkpoint_interval = 25

[sweep.policy.proj_dim]
distribution = uniform_pow2
min = 4
max = 16
mean = 8
scale = auto

;[sweep.train.total_timesteps]
;distribution = uniform
;min = 1_000_000_000
;max = 5_000_000_000
;mean = 3_000_000_000
;scale = auto

;[sweep.env.reward_repetition]
;distribution = uniform
;min = -1.0
;max = 0.0
;mean = 0.05
;scale = auto

;[sweep.env.reward_draw]
;distribution = uniform
;min = -0.5
;max = 0.0
;mean = -0.1
;scale = auto

;[sweep.train.learning_rate]
