[base]
package = ocean
env_name = puffer_chess
policy_name = Policy
rnn_name = Recurrent

[policy]
use_simple_model = False
use_advanced_cnn = True
cnn_channels = 128
hidden_size = 512

[rnn]
input_size = 512
hidden_size = 512

[vec]
num_envs = 4
num_workers = 4
backend = Multiprocessing

[env]
num_envs = 128
moves_per_episode = 240
max_depth = 240
# Rewards focused on puzzle solving
reward_draw = -0.5
reward_win_white = 1.0
reward_puzzle_solved = 1.0
reward_puzzle_failed = -0.1
reward_correct_move = 0.1
reward_puzzle_correct_piece = 0.01
reward_puzzle_closer_to_target = 0.02
reward_puzzle_correct_promotion = 0.01
debug_disable_mask = 0
stockfish_enabled = 0
self_play = 0
episode_per_color = 0
puzzle_mode = 1
puzzle_difficulty = 1
puzzle_success_threshold = 0.9
puzzle_database_path = "/puffertank/release_test_pufferlib/pufferlib/resources/chess/filtered_puzzles/white_1move_all.json"
puzzle_tries_per_env = 1
puzzle_set_size = 40
frozen_policy_update_frequency = 32
render_mode = raylib

[train]
name = improved_puzzle_training
project = chess
checkpoint_interval = 20
total_timesteps = 10000000  # 10M steps for better convergence

# KEY CHANGES FOR BETTER LEARNING:
bptt_horizon = 1  # Shortest rollout to capture solutions
minibatch_size = 256  # Smaller minibatches for stability
batch_size = 8192  # Moderate batch size

# CRITICAL: Much higher BC coefficient that decays slowly
bc_coef = 500.0  # Very high initial BC coefficient
bc_anneal = 0.999  # Much slower decay (was 0.995)

# Lower learning rate for stability
learning_rate = 0.001  # Lower LR (was 0.01)
optimizer = adam

# Higher entropy for exploration
ent_coef = 0.02  # Higher entropy (was 0.01)

# Standard PPO params
gamma = 0.99
gae_lambda = 0.95
clip_range = 0.2
vf_coef = 0.5
max_grad_norm = 0.5
update_epochs = 4

[sweep]
method = Protein
metric = score
goal = maximize
downsample = 0