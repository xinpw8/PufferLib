[base]
package = ocean
env_name = puffer_chess
# Choose chess model: 
# - "Policy" for ChessRecurrent (simple, 925K params, faster) - already includes LSTM
# - "ChessConvPolicy" for ChessConvRecurrent (advanced CNN, 3M params, slower but potentially stronger)
policy_name = Policy
# Set rnn_name for LSTM state handling, but Policy already includes LSTM wrapper
rnn_name = Recurrent

[policy]
# Advanced CNN options (only used if policy_name = ChessConvPolicy)
use_advanced_cnn = True
cnn_channels = 64
hidden_size = 256

[rnn]
input_size = 256
hidden_size = 256

[vec]
# Reduced for debugging - increase once working
num_envs = 16  # Start small for debugging
num_workers = 4  # Use 4 workers (16/4 = 4 envs per worker)
backend = Multiprocessing

[env]
num_envs = 16  # Match vec num_envs
moves_per_episode = 240  # only used in double_buffered_chess wrapper
max_depth = 240 # no depth limit in puzzle mode
reward_valid = 0.0
reward_invalid_white = 0.0
reward_invalid_black = 0.0
reward_white_captures_enemy_piece = 0.0
reward_black_captures_enemy_piece = 0.0
reward_draw = -0.5
reward_win_white = 1.0
reward_win_black = 0.0
reward_loss_white = 0.0
reward_loss_black = 0.0
reward_check_white = 0.1
reward_check_black = 0.0
reward_material_diff_white = 0.1
reward_material_diff_black = 0.0
reward_puzzle_solved = 1.0
reward_puzzle_failed = -0.1
reward_correct_move = 0.1
reward_puzzle_correct_piece = 0.01
reward_puzzle_closer_to_target = 0.02
reward_puzzle_correct_promotion = 0.01
debug_disable_mask = 0
stockfish_enabled = 0
stockfish_cmd = "stockfish" 
stockfish_elo = 1320
stockfish_search_ms = 10
stockfish_hash_mb = 4
full_game_logging_frequency = 5
self_play = 0  # Disabled in puzzle mode
episode_per_color = 0  # Disabled when puzzle_mode is enabled
puzzle_mode = 1
puzzle_difficulty = 1
puzzle_success_threshold = 0.9
puzzle_database_path = "pufferlib/resources/chess/games_database/lichess_db_puzzle.csv.zst"
puzzle_tries_per_env = 50  # Reduced for debugging
frozen_policy_update_frequency = 32  # Update frozen policy every N epochs - not used in constructor
render_mode = raylib

[train]
# Fixed batch size for small environment count
# segments = batch_size / horizon must be >= total_agents (num_envs * num_envs)
name = xinpw8 
project = chess
checkpoint_interval = 20
total_timesteps = 12_000_000_000
bptt_horizon = 16
minibatch_size = 256  # Increased for 16 envs
batch_size = 4096  # 16 envs * 16 = 256 agents, need 256 segments minimum
gamma = 0.994
learning_rate = 0.0003  # Reduced learning rate

; [train]
; # not debugging
; name = xinpw8 
; project = chess
; checkpoint_interval = 20
; total_timesteps = 12_000_000_000
; bptt_horizon = 4 # 16 # 32
; minibatch_size = 4096
; batch_size = 131_072
; gamma = 0.994
; learning_rate = 0.0005

[sweep]
method = Protein
metric = episode_return
goal = maximize
downsample = 10

[sweep.train.batch_size]
distribution = uniform_pow2
min = 32768
max = 65536
mean = 32768
scale = auto

[sweep.train.bptt_horizon]
distribution = uniform_pow2
min = 8
max = 32
mean = 16
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.0001
max = 0.001
mean = 0.00024263349414255656
scale = 0.5

[sweep.train.gamma]
distribution = logit_normal
min = 0.95
max = 0.9999
mean = 0.99
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.9
max = 0.999
mean = 0.98
scale = auto

[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 2048 # Minimum for stability
max = 8192 # 65536
mean = 4096 # Match working config
scale = auto

[sweep.train.total_timesteps]
distribution = log_normal
min = 600_000 # short runs for testing
max = 1_000_000
mean = 800_000
scale = 0.5

[sweep.env.reward_white_captures_enemy_piece]
distribution = uniform
min = 0.0
max = 1.0
mean = 0.5
scale = 0.5

[sweep.env.reward_black_captures_enemy_piece]
