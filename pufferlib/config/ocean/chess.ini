[base]
package = ocean
env_name = puffer_chess
policy_name = ChessRecurrent
rnn_name = Recurrent

[rnn]
input_size = 256
hidden_size = 256

[vec]
num_envs = 1

[env]
num_envs = 4096
reward_valid = 0.0
reward_invalid = -1.0
reward_agent_captures_enemy_piece = 0.1
reward_enemy_captures_agent_piece = -0.1
reward_win = 1.0
reward_draw = 0.0
reward_loss = -1.0

[train]
total_timesteps = 100_000_000
checkpoint_interval = 20
learning_rate = 0.003
gamma = 0.99
gae_lambda = 0.95
update_epochs = 1
norm_adv = True
clip_coef = 0.2
clip_vloss = True
ent_coef = 0.001
vf_coef = 0.5
max_grad_norm = 0.5
minibatch_size = 8192
bptt_horizon = 16