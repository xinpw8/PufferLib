[base]
package = ocean
env_name = puffer_chess
policy_name = ChessRecurrent
rnn_name = Recurrent

[rnn]
input_size = 256
hidden_size = 256

[vec]
num_envs = 1
backend = Multiprocessing

[env]
num_envs = 1024
reward_valid = 0.0001
reward_invalid = -0.00001
reward_agent_captures_enemy_piece = 0.1
reward_enemy_captures_agent_piece = -0.1
reward_win = 5.0
reward_draw = -3.0
reward_loss = -2.0
reward_check = 0.5
max_depth = 100
reward_material_diff = 0.1
debug_disable_mask = 0
# Stockfish integration
stockfish_enabled = 0
stockfish_cmd = "/root/stockfish/stockfish/stockfish-ubuntu-x86-64"
stockfish_elo = 1320
stockfish_search_ms = 10
stockfish_hash_mb = 4

# enable/disable self-play
self_play = 1

# Raylib rendering
render_mode = raylib

[train]
total_timesteps = 1_000_000_000
checkpoint_interval = 100
learning_rate = 0.015
gamma = 0.99998
gae_lambda = 0.95
update_epochs = 1
batch_size = auto
minibatch_size = 2048
clip_coef = 0.15
vf_coef = 0.5
ent_coef = 0.01
max_grad_norm = 0.5
bptt_horizon = 32
anneal_lr = True