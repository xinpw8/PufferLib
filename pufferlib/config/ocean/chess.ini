[base]
package = ocean
env_name = puffer_chess
policy_name = ChessLight

[vec]
backend = Multiprocessing
num_envs = 4

[env]
num_envs = 4096
max_moves = 200
reward_draw = -0.05
reward_invalid_piece = 0.0
reward_invalid_move = 0.0
reward_repetition = -0.01
reward_capture_scale = 1.0
enable_50_move_rule = 1
enable_threefold_repetition = 1
selfplay = 1
human_play = 0
random_bot = 0
fen_file = fens2.txt
fen_file_dm = fens_deepmind.txt
fen_curric_pct = 0.25
deepmind_fen_pct = 0.0

[policy]
square_dim = 64
proj_dim = 8
num_spatial = 2
embed_dim = 32
hidden_size = 256
use_action_masking = 1

[train]
seed = 42
torch_deterministic = True
device = cuda
use_rnn = False
optimizer = adam
anneal_lr = True
adam_beta1 = 0.9
adam_beta2 = 0.999
adam_eps = 1e-8
clip_coef = 0.2
ent_coef = 0.05
gae_lambda = 0.95
gamma = 0.999
learning_rate = 0.0005
min_lr_ratio = 0.1
total_timesteps = 50_000_000_000
update_epochs = 1
minibatch_size = 32768
max_minibatch_size = 32768
bptt_horizon = 256
vf_coef = 1.0
vf_clip_coef = 0.5
max_grad_norm = 1.0
vtrace_rho_clip = 1.0
vtrace_c_clip = 1.0
prio_alpha = 0.6
prio_beta0 = 0.4
checkpoint_interval = 10
