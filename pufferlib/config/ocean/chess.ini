[base]
package = ocean
env_name = puffer_chess
policy_name = Policy
rnn_name = Recurrent

[policy]
use_simple_model = False
use_advanced_cnn = True
cnn_channels = 256  # Doubled CNN channels for better feature extraction
hidden_size = 2048  # Doubled hidden size for more capacity

[rnn]
input_size = 2048  # Match policy hidden_size
hidden_size = 2048  # Doubled RNN capacity

[vec]
num_envs = 4
num_workers = 4
backend = Multiprocessing

[env]
num_envs = 4  # 64 parallel environments (8 per worker)
moves_per_episode = 240
max_depth = 240
# Rewards focused on puzzle solving
reward_draw = -0.5
reward_win_white = 1.0
reward_puzzle_solved = 0.0  # Disable rewards for pure BC training
reward_puzzle_failed = 0.0
reward_correct_move = 0.0
reward_puzzle_correct_piece = 0.0
reward_puzzle_closer_to_target = 0.0
reward_puzzle_correct_promotion = 0.0
debug_disable_mask = 0
stockfish_enabled = 0
self_play = 0
episode_per_color = 0
puzzle_mode = 1
puzzle_difficulty = 1
puzzle_success_threshold = 0.9
puzzle_database_path = "/puffertank/pufferlib/pufferlib/resources/chess/filtered_puzzles/white_1move_all.json"
puzzle_tries_per_env = 1
puzzle_set_size = 500 # 3703  # All puzzles
frozen_policy_update_frequency = 32
render_mode = raylib

[train]
name = improved_puzzle_training
project = chess
checkpoint_interval = 500
total_timesteps = 50000000  # 50M steps with 256 envs

# KEY CHANGES FOR BETTER LEARNING:
bptt_horizon = 1  # Shortest rollout to capture solutions
minibatch_size = 512 # 512  # Good minibatch size
batch_size = 2048 # 2048 # 8192  # Optimal batch size for coverage

# CRITICAL: Balanced BC to prevent mode collapse
bc_coef = 200.0  # Moderate BC coefficient
bc_anneal = 0.999  # Gradual decay

# Lower learning rate for stability
learning_rate = 0.0001  # Reduced LR for fine-tuning phase
optimizer = adam

# Entropy for exploration
ent_coef = 0.001  # Low entropy for supervised learning

# Standard PPO params
gamma = 0.99
gae_lambda = 0.95
clip_range = 0.1  # Lower clip range for 2 envs
vf_coef = 0.5
max_grad_norm = 0.5
update_epochs = 8  # Good number of epochs

[sweep]
method = "Protein"
metric = "score"
goal = "maximize"
downsample = 100

[sweep.train]
[sweep.train.learning_rate]
distribution = "log_normal"
mean = 0.0002
min = 0.00001
max = 0.001
scale = 1.0

[sweep.train.bc_coef]
distribution = "uniform"
mean = 200
min = 50
max = 500
scale = 1.0

[sweep.train.bc_anneal]
distribution = "uniform"
mean = 0.997
min = 0.99
max = 0.9999
scale = 1.0

[sweep.train.batch_size]
distribution = "uniform_pow2"
mean = 2048
min = 512
max = 8192
scale = 1.0

[sweep.train.minibatch_size]
distribution = "uniform_pow2"
mean = 512
min = 128
max = 1024
scale = 1.0

[sweep.train.update_epochs]
distribution = "int_uniform"
mean = 5
min = 1
max = 10
scale = 1.0

[sweep.train.ent_coef]
distribution = "log_normal"
mean = 0.001
min = 0.0001
max = 0.01
scale = 1.0

[sweep.train.vf_coef]
distribution = "uniform"
mean = 0.5
min = 0.1
max = 1.0
scale = 1.0

[sweep.train.max_grad_norm]
distribution = "uniform"
mean = 1.0
min = 0.5
max = 5.0
scale = 1.0

[sweep.train.clip_range]
distribution = "uniform"
mean = 0.1
min = 0.05
max = 0.2
scale = 1.0

[sweep.train.gae_lambda]
distribution = "uniform"
mean = 0.95
min = 0.9
max = 0.99
scale = 1.0

[sweep.env]
[sweep.env.puzzle_set_size]
distribution = "int_uniform"
mean = 250
min = 100
max = 500
scale = 1.0