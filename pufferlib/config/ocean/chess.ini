[base]
package = ocean
env_name = puffer_chess
policy_name = Policy
rnn_name = Recurrent

[env]
num_envs = 1024
reward_valid_move = 0.01
reward_invalid_move = -0.1
reward_agent_captures_enemy_piece = 0.05
reward_enemy_captures_agent_piece = -0.05
reward_win = 1.0
reward_draw = 0.0
reward_loss = -1.0

[train]
total_timesteps = 100_000_000
checkpoint_interval = 50_000_000
batch_size = 32768
learning_rate = 0.0003
gamma = 0.99
gae_lambda = 0.95
num_minibatches = 4
update_epochs = 4
norm_adv = True
clip_coef = 0.2
clip_vloss = True
ent_coef = 0.01
vf_coef = 0.5
max_grad_norm = 0.5
target_kl = 0.015
bptt_horizon = 16