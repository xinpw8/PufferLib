[base]
package = ocean
env_name = puffer_chess
policy_name = Policy
rnn_name = None

[rnn]
input_size = 128
hidden_size = 128

[vec]
num_envs = 4

[env]
num_envs = 1024
reward_valid = 0.001
reward_invalid = -0.1
reward_agent_captures_enemy_piece = 0.05
reward_enemy_captures_agent_piece = -0.05
reward_win = 2.0
reward_draw = -0.2
reward_loss = -2.0
reward_check = 0.1
max_depth = 200

[train]
total_timesteps = 1_000_000_000
checkpoint_interval = 100
learning_rate = 0.0003
gamma = 0.997
gae_lambda = 0.95
update_epochs = 1
batch_size = 131072
clip_coef = 0.1
vf_coef = 0.5
ent_coef = 0.01
max_grad_norm = 0.5
bptt_horizon = 32
device = cuda