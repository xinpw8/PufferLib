[base]
package = ocean
env_name = puffer_chess
policy_name = ChessRecurrent
rnn_name = Recurrent

[rnn]
input_size = 256
hidden_size = 256

[vec]
num_envs = 4
num_workers = 4
backend = Multiprocessing

[env]
num_envs = 256
reward_valid = 0.00001
reward_invalid_white = -0.0001
reward_invalid_black = -0.0001
reward_agent_captures_enemy_piece = 0.0005
reward_enemy_captures_agent_piece = -0.0005
reward_draw = -0.05
reward_win_white = 1.0
reward_win_black = 1.0
reward_loss_white = -1.0
reward_loss_black = -1.0
reward_check_white = 0.002
reward_check_black = 0.002
max_depth = 50
reward_material_diff_white = 0.0001
reward_material_diff_black = 0.0001
debug_disable_mask = 0
# Stockfish integration
stockfish_enabled = 0
stockfish_cmd = "/root/stockfish/stockfish/stockfish-ubuntu-x86-64"
stockfish_elo = 1320
stockfish_search_ms = 10
stockfish_hash_mb = 4

# full game logging frequency
full_game_logging_frequency = 500000

# enable/disable self-play
self_play = 1

# Raylib rendering
render_mode = raylib

[train]
total_timesteps = 400_000_000
adam_beta1 = 0.9602226117399812
adam_beta2 = 0.999983918771099
adam_eps = 2.109767652202695e-9
bptt_horizon = 8
minibatch_size = 2048
clip_coef = 0.5716251062832933
ent_coef = 0.009778379693175061
gae_lambda = 0.9924829173144767
gamma = 0.9433427558493771
learning_rate = 0.00014263349414255656
