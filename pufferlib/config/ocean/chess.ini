[base]
package = ocean
env_name = puffer_chess
# Choose chess model: 
# - "Policy" for ChessRecurrent (simple, 925K params, faster) - already includes LSTM
# - "ChessConvPolicy" for ChessConvRecurrent (advanced CNN, 3M params, slower but potentially stronger)
policy_name = Policy
rnn_name = Recurrent

[policy]
use_simple_model = False
use_advanced_cnn = False  # ChessConvRecurrent is used if True
cnn_channels = 64
hidden_size = 128

[rnn]
input_size = 128
hidden_size = 128

[vec]
num_envs = 4  # Number of parallel vectorized environments (match physical CPU cores)
num_workers = 4 # should match vec.num_envs
backend = Multiprocessing

[env]
num_envs = 128 # should be as high as hardware allows for better throughput
moves_per_episode = 240  # only used in double_buffered_chess wrapper
max_depth = 240 # no depth limit in puzzle mode
reward_valid = 0.0
reward_invalid_white = 0.0
reward_invalid_black = 0.0
reward_white_captures_enemy_piece = 0.0
reward_black_captures_enemy_piece = 0.0
reward_draw = -0.5
reward_win_white = 1.0
reward_win_black = 0.0
reward_loss_white = 0.0
reward_loss_black = 0.0
reward_check_white = 0.1
reward_check_black = 0.0
reward_material_diff_white = 0.1
reward_material_diff_black = 0.0
reward_puzzle_solved = 1.0
reward_puzzle_failed = -0.1
reward_correct_move = 0.1
reward_puzzle_correct_piece = 0.01
reward_puzzle_closer_to_target = 0.02
reward_puzzle_correct_promotion = 0.01
debug_disable_mask = 0
stockfish_enabled = 0
stockfish_cmd = "stockfish" 
stockfish_elo = 1320
stockfish_search_ms = 10
stockfish_hash_mb = 4
full_game_logging_frequency = 500000
self_play = 0  # Disabled in puzzle mode
episode_per_color = 0  # Disabled when puzzle_mode is enabled
puzzle_mode = 1
puzzle_difficulty = 1
puzzle_success_threshold = 0.9
puzzle_database_path = "/puffertank/release_test_pufferlib/pufferlib/resources/chess/filtered_puzzles/white_1move_all.json"
puzzle_tries_per_env = 1  # Reset after each attempt to keep solutions valid
puzzle_set_size = 20  # Number of mate-in-1 puzzles to train on (increased from 5 to avoid overfitting)
frozen_policy_update_frequency = 32  # Update frozen policy every N epochs - not used in constructor
render_mode = raylib

[train]
# Fixed batch size for small environment count
# segments = batch_size / horizon must be >= total_agents (num_envs * num_envs)
name = xinpw8 
project = chess
checkpoint_interval = 20
total_timesteps = 20000000
bptt_horizon = 1  # Shortest rollout to capture solutions before they go bad
final_eval_iters = 5
minibatch_size = 256 # 2048 # 16384 # 32768
batch_size = 512  # Smaller batch to train before solutions go bad
learning_rate = 0.01  # Higher LR to escape local minimum
optimizer = adam
bc_coef = 15.0  # Moderate BC coefficient to allow state learning
bc_anneal = 0.995  # Slow annealing to maintain BC influence
ent_coef = 0.01  # Higher entropy to prevent mode collapse

[sweep]
method = Protein
metric = score
goal = maximize
downsample = 0

[sweep.train.batch_size]
distribution = uniform_pow2
min = 2048 # Minimum for stability
max = 8192 # 65536
mean = 4096 # Match working config
scale = auto

[sweep.train.bptt_horizon]
distribution = uniform_pow2
min = 8
max = 32
mean = 16
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.0001
max = 0.01
mean = 0.001
scale = 0.5

[sweep.train.gamma]
distribution = logit_normal
min = 0.91
max = 0.9999
mean = 0.96
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.9
max = 0.999
mean = 0.96
scale = auto

[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 128 # Minimum for stability
max = 1024 # 65536
mean = 512 # Match working config
scale = auto

[sweep.train.total_timesteps]
distribution = log_normal
min = 32768 # 8192 # 3000
max = 65536 # 16384 # 5000
mean = 49152 # 12000 # 4000
scale = 0.5


