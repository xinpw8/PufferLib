[base]
package = ocean
env_name = puffer_chess
policy_name = ChessRecurrent
rnn_name = Recurrent

[rnn]
input_size = 256
hidden_size = 256

[vec]
num_envs = 1024
num_workers = 8

[env]
num_envs = 1024
# Refined reward structure for better learning
reward_valid = 0.001  # Small positive for legal moves
reward_invalid = -1.0  # Strong penalty for illegal moves
reward_agent_captures_enemy_piece = 0.05  # Encourage captures
reward_enemy_captures_agent_piece = -0.05  # Discourage being captured
reward_win = 1.0
reward_draw = 0.0  # Neutral for draws initially
reward_loss = -1.0

[train]
total_timesteps = 1_000_000_000  # 1B steps for strong play
checkpoint_interval = 100
learning_rate = 0.0003  # Lower LR for stability
gamma = 0.997  # Higher gamma for long-term planning
gae_lambda = 0.95
update_epochs = 1  # More epochs per batch
clip_coef = 0.1  # Tighter clipping for stability
vf_coef = 0.5
ent_coef = 0.01  # Higher entropy for exploration
max_grad_norm = 0.5
minibatch_size = 32768  # Larger batches for stable learning
bptt_horizon = 64
batch_size = 262144  # Larger batch size
max_minibatch_size = 32768
# Advanced hyperparameters
anneal_lr = True
compile = True
compile_mode = default
precision = bfloat16  # Use bfloat16 for faster training
device = cuda