[base]
package = ocean
env_name = puffer_chess
policy_name = Policy
rnn_name = Recurrent

[policy]
use_simple_model = False
use_advanced_cnn = True
cnn_channels = 128
hidden_size = 512

[rnn]
input_size = 512
hidden_size = 512

[vec]
num_envs = 4
num_workers = 4
backend = Multiprocessing

[env]
num_envs = 64  # 64 parallel environments (8 per worker)
moves_per_episode = 240
max_depth = 240
# Rewards focused on puzzle solving
reward_draw = -0.5
reward_win_white = 1.0
reward_puzzle_solved = 1.0
reward_puzzle_failed = -0.1
reward_correct_move = 0.1
reward_puzzle_correct_piece = 0.01
reward_puzzle_closer_to_target = 0.02
reward_puzzle_correct_promotion = 0.01
debug_disable_mask = 0
stockfish_enabled = 0
self_play = 0
episode_per_color = 0
puzzle_mode = 1
puzzle_difficulty = 1
puzzle_success_threshold = 0.9
puzzle_database_path = "/puffertank/release_test_pufferlib/pufferlib/resources/chess/filtered_puzzles/white_1move_all.json"
puzzle_tries_per_env = 1
puzzle_set_size = 3703  # All puzzles
frozen_policy_update_frequency = 32
render_mode = raylib

[train]
name = improved_puzzle_training
project = chess
checkpoint_interval = 500
total_timesteps = 50000000  # 50M steps with 256 envs

# KEY CHANGES FOR BETTER LEARNING:
bptt_horizon = 1  # Shortest rollout to capture solutions
minibatch_size = 512  # Good minibatch size
batch_size = 8192  # Optimal batch size for coverage

# CRITICAL: Balanced BC to prevent mode collapse
bc_coef = 100.0  # Moderate BC coefficient
bc_anneal = 0.999  # Gradual decay

# Lower learning rate for stability
learning_rate = 0.00002  # Lower LR for stability with many envs
optimizer = adam

# Entropy for exploration
ent_coef = 0.001  # Low entropy for supervised learning

# Standard PPO params
gamma = 0.99
gae_lambda = 0.95
clip_range = 0.1  # Lower clip range for 2 envs
vf_coef = 0.5
max_grad_norm = 0.5
update_epochs = 8  # Good number of epochs

[sweep]
method = Protein
metric = score
goal = maximize
downsample = 0