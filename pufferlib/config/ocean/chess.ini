[base]
package = ocean
env_name = puffer_chess
policy_name = ChessRecurrent
rnn_name = Recurrent

[rnn]
input_size = 256
hidden_size = 256

[vec]
num_envs = 1

[env]
num_envs = 4096
reward_valid = 10
reward_invalid = -0.0001
reward_agent_captures_enemy_piece = 100
reward_enemy_captures_agent_piece = -0.01
reward_win = 1.0
reward_draw = -0.001
reward_loss = -1.0

[train]
total_timesteps = 100_000_000
checkpoint_interval = 50_000_000
learning_rate = 0.0003
gamma = 0.99
gae_lambda = 0.95
update_epochs = 1
norm_adv = True
clip_coef = 0.2
clip_vloss = True
ent_coef = 0.01
vf_coef = 0.5
max_grad_norm = 0.5
target_kl = 0.015
bptt_horizon = 64