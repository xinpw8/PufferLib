[base]
package = ocean
env_name = puffer_chess
policy_name = Chess
rnn_name = Recurrent

[vec]
backend = Multiprocessing
num_envs = 8

[env]
num_envs = 1024
max_moves = 50000
reward_draw = 0.0
reward_invalid_piece = 0.0
reward_invalid_move = 0.0
reward_valid_piece = 0.0
reward_valid_move = 0.0
reward_material = 0
reward_position = 0.0
reward_castling = 0.0
reward_repetition = 0.0
enable_50_move_rule = 1
enable_threefold_repetition = 1
selfplay = 1
human_play = 0

[policy]
hidden_size = 128
cnn_channels = 64
embed_dim = 32
use_action_masking = 1

[rnn]
input_size = 128
hidden_size = 128

[train]
seed = 42
torch_deterministic = True
device = cuda
optimizer = muon
anneal_lr = True
learning_rate = 0.003558190322899363
min_lr_ratio = 0.19561869806341867
total_timesteps = 15_000_000_000
update_epochs = 1
minibatch_size = 32768
bptt_horizon = 64
gamma = 0.995
gae_lambda = 0.90
ent_coef = 0.009630912248933756
clip_coef = 0.05000000000000005
vf_coef = 1.9084330787014936
vf_clip_coef = 1.950962354651517
max_grad_norm = 0.3
adam_eps = 0.00003782293154924503
adam_beta1 = 0.9764528241377314
adam_beta2 = 0.99982224753046
vtrace_rho_clip = 1.9968085944850584
vtrace_c_clip = 1.0144967498551305
prio_alpha = 0.9442343754000484
prio_beta0 = 0.09999999999999998

[sweep]
method = Protein
metric = elo
metric_distribution = normal
goal = maximize
downsample = 5
use_gpu = True
prune_pareto = True
early_stop_quantile = 0.3
max_cost = 7200

[sweep.train.learning_rate]
distribution = log_normal
min = 1e-5
max = 5e-3
mean = 5e-4
scale = auto

[sweep.train.min_lr_ratio]
distribution = uniform
min = 0.0
max = 0.3
mean = 0.1
scale = auto

[sweep.train.ent_coef]
distribution = log_normal
min = 0.001
max = 0.1
mean = 0.01
scale = auto

[sweep.train.clip_coef]
distribution = logit_normal
min = 0.05
max = 0.5
mean = 0.2
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.99
max = 0.9999
mean = 0.995
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.85
max = 0.92
mean = 0.88
scale = auto

[sweep.train.max_grad_norm]
distribution = uniform
min = 0.3
max = 3.0
mean = 1.0
scale = auto

[sweep.train.vf_coef]
distribution = uniform
min = 0.3
max = 3.0
mean = 1.0
scale = auto

[sweep.train.vf_clip_coef]
distribution = uniform
min = 0.2
max = 2.0
mean = 0.5
scale = auto

[sweep.train.vtrace_rho_clip]
distribution = uniform
min = 0.1
max = 3.0
mean = 1.0
scale = auto

[sweep.train.vtrace_c_clip]
distribution = uniform
min = 0.1
max = 3.0
mean = 1.0
scale = auto

[sweep.train.prio_alpha]
distribution = logit_normal
min = 0.3
max = 0.99
mean = 0.8
scale = auto

[sweep.train.prio_beta0]
distribution = logit_normal
min = 0.1
max = 0.99
mean = 0.5
scale = auto

[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 8192
max = 65536
mean = 32768
scale = auto

[sweep.train.bptt_horizon]
distribution = uniform_pow2
min = 128
max = 512
scale = auto

[sweep.env.reward_draw]
distribution = uniform
min = -0.1
max = 0.0
mean = 0.0
scale = auto
