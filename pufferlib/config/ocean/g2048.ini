[base]
package = ocean
env_name = puffer_g2048
policy_name = G2048LSTM
rnn_name = Recurrent

[policy]
hidden_size = 512
num_layers = 1

[rnn]
input_size = 512
hidden_size = 512

[vec]
total_agents = 8192
num_threads = 7
num_buffers = 4

[env]
scaffolding_ratio = 0.67

[train]
# Simplified 2048 + power-1.5 merge reward run family:
# https://wandb.ai/kywch/pufferlib/runs/1v5kls7l
# Long training is expected: 65k takeoff usually begins far into training.
total_timesteps = 8_000_000_000
anneal_lr = True
min_lr_ratio = 0.15
batch_size = auto
horizon = 64
minibatch_size = 32_768

clip_coef = 0.067
ent_coef = 0.0267
gae_lambda = 0.67
gamma = 0.99567
vf_clip_coef = 0.167
vf_coef = 2.0

learning_rate = 0.000467
max_grad_norm = 0.5
replay_ratio = 1.0

beta1 = 0.99
beta2 = 0.9999
eps = 0.0001
prio_alpha = 0.8
prio_beta0 = 0.1
vtrace_c_clip = 2.0
vtrace_rho_clip = 1.1

### Targeted sweep

[sweep]
method = Protein
metric = reached_65536
goal = maximize
downsample = 5
max_suggestion_cost = 3600
sweep_only = scaffolding_ratio, learning_rate, replay_ratio, horizon, minibatch_size, total_agents, hidden_size, num_layers, ent_coef, vf_coef

[sweep.env.scaffolding_ratio]
distribution = uniform
min = 0.45
mean = 0.67
max = 0.85
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.0001
mean = 0.000467
max = 0.001
scale = auto

[sweep.train.max_grad_norm]
distribution = uniform
min = 0.3
mean = 0.6
max = 1.2
scale = auto

[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 256
max = 1024
scale = auto

[sweep.policy.num_layers]
distribution = int_uniform
min = 1
max = 2
scale = auto

[sweep.vec.total_agents]
distribution = uniform_pow2
min = 4096
max = 32768
scale = auto

[sweep.vec.num_threads]
distribution = int_uniform
min = 2
max = 8
scale = auto

[sweep.vec.num_buffers]
distribution = int_uniform
min = 1
max = 4
scale = auto

[sweep.train.horizon]
distribution = uniform_pow2
min = 32
max = 128
scale = auto

[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 16384
max = 65536
scale = auto

[sweep.train.replay_ratio]
distribution = uniform
min = 0.75
max = 2.0
scale = auto

[sweep.train.ent_coef]
distribution = log_normal
min = 0.005
mean = 0.02
max = 0.08
scale = auto

[sweep.train.vf_coef]
distribution = uniform
min = 0.5
mean = 2.0
max = 3.0
scale = auto

