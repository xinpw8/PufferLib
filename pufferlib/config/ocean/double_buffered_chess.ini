[base]
package = ocean
env_name = puffer_double_buffered_chess  
policy_name = ChessRecurrent
rnn_name = ChessLSTM

[rnn]
input_size = 256
hidden_size = 256

[vec]
num_envs = 4
num_workers = 4
backend = Multiprocessing

[env]
num_envs = 512
moves_per_episode = 128  # align with bptt_horizon=32 for clean segments
max_depth = 128 # 256
reward_valid = -0.01
reward_invalid_white = -0.0001
reward_invalid_black = -0.0001
reward_white_captures_enemy_piece = 0.5
reward_black_captures_enemy_piece = 0.5
reward_draw = -0.05
reward_win_white = 1.0
reward_win_black = 1.0
reward_loss_white = -1.0
reward_loss_black = -1.0
reward_check_white = 0.2
reward_check_black = 0.2
reward_material_diff_white = 0.015
reward_material_diff_black = 0.015
# reward_max_depth_termination = -0.1  # Field removed from struct
# Piece-value-based capture rewards (fields removed from struct)
# use_piece_value_capture_rewards = 1
# piece_value_reward_multiplier = 0.1
debug_disable_mask = 0

# Stockfish integration (disabled for self-play)
stockfish_enabled = 0
stockfish_cmd = "stockfish"
stockfish_elo = 1320
stockfish_search_ms = 10
stockfish_hash_mb = 4

full_game_logging_frequency = 2
self_play = 1
episode_per_color = 1
frozen_policy_update_frequency = 128  # Update frozen policy every N epochs

# Raylib rendering
render_mode = raylib

[train]
checkpoint_interval = 20
total_timesteps = 1_400_000_000
adam_beta1 = 0.9602226117399812
adam_beta2 = 0.999983918771099
adam_eps = 2.109767652202695e-9
bptt_horizon = 64 # 64
minibatch_size = 16384
clip_coef = 0.25
ent_coef = 0.009778379693175061
gae_lambda = 0.98
gamma = 0.99
learning_rate = 0.00024263349414255656

[sweep]
method = Protein
metric = episode_return
goal = maximize

[sweep.env.num_envs]
distribution = uniform_pow2
min = 256
max = 1024
mean = 512
scale = auto

[sweep.train.batch_size]
distribution = uniform_pow2
min = 32768
max = 262144
mean = 131072
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.0001
max = 0.01
mean = 0.001
scale = 0.5

[sweep.train.gamma]
distribution = logit_normal
min = 0.95
max = 0.9999
mean = 0.99
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.9
max = 0.999
mean = 0.98
scale = auto

[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 8192
max = 65536
mean = 16384
scale = auto

[sweep.train.bptt_horizon]
distribution = uniform_pow2
min = 32
max = 128
mean = 64
scale = auto

[sweep.env.reward_white_captures_enemy_piece]
distribution = uniform
min = 0.0
max = 1.0
mean = 0.5
scale = 0.5

[sweep.env.reward_black_captures_enemy_piece]
