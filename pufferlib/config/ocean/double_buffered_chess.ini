[base]
package = ocean
env_name = puffer_double_buffered_chess
policy_name = ChessRecurrent
rnn_name = ChessLSTM

[rnn]
input_size = 256
hidden_size = 256

[vec]
num_envs = 4
num_workers = 4
backend = Multiprocessing

[env]
num_envs = 512
moves_per_episode = 128  # align with bptt_horizon=32 for clean segments
max_depth = 128 # 256
reward_valid = -0.01
reward_invalid_white = -0.0001
reward_invalid_black = -0.0001
reward_white_captures_enemy_piece = 0.5448852757354441
reward_black_captures_enemy_piece = 0.576121236557866
reward_draw = -0.04103810227398357
reward_win_white = 1.1616366536099763
reward_win_black = 0.8924627348717985
reward_loss_white = -1.1979124304749638
reward_loss_black = -0.7194522768985948
reward_check_white = 0.20022612189980463
reward_check_black = 0.19258166033018312
reward_material_diff_white = 0.014145560956315636
reward_material_diff_black = 0.01406126976230773
debug_disable_mask = 0
stockfish_enabled = 0
stockfish_cmd = "stockfish"
stockfish_elo = 1320
stockfish_search_ms = 10
stockfish_hash_mb = 4
full_game_logging_frequency = 2
self_play = 1
episode_per_color = 1
frozen_policy_update_frequency = 128  # Update frozen policy every N epochs
render_mode = raylib

[train]
checkpoint_interval = 20
total_timesteps = 200000
adam_beta1 = 0.9602226117399812
adam_beta2 = 0.999983918771099
adam_eps = 2.109767652202695e-9
bptt_horizon = 16
minibatch_size = 4096
batch_size = 32768
clip_coef = 0.25
ent_coef = 0.009778379693175061
gae_lambda = 0.98
gamma = 0.99
learning_rate = 0.00019857760671179733

[sweep]
method = Protein
metric = episode_return
goal = maximize
downsample = 10

[sweep.train.batch_size]
distribution = uniform_pow2
min = 32768
max = 65536
mean = 32768
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.0001
max = 0.001
mean = 0.00024263349414255656
scale = 0.5

[sweep.train.gamma]
distribution = logit_normal
min = 0.95
max = 0.9999
mean = 0.99
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.9
max = 0.999
mean = 0.98
scale = auto

[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 2048 # Minimum for stability
max = 8192 # 65536
mean = 4096 # Match working config
scale = auto

[sweep.train.bptt_horizon]
distribution = uniform_pow2
min = 8 # 32 local hardware cannot handle >32
max = 32 # 128
mean = 16 # 64
scale = auto

[sweep.train.total_timesteps]
distribution = log_normal
min = 600_000 # short runs for testing
max = 1_000_000
mean = 800_000
scale = 0.5

[sweep.env.reward_white_captures_enemy_piece]
distribution = uniform
min = 0.0
max = 1.0
mean = 0.5
scale = 0.5

[sweep.env.reward_black_captures_enemy_piece]
distribution = uniform
min = 0.0
max = 1.0
mean = 0.5
scale = 0.5

[sweep.env.reward_draw]
distribution = uniform
min = -0.2
max = 0.0
mean = -0.05
scale = 0.1

[sweep.env.reward_win_white]
distribution = uniform
min = 0.5
max = 2.0
mean = 1.0
scale = 0.5

[sweep.env.reward_win_black]
distribution = uniform
min = 0.5
max = 2.0
mean = 1.0
scale = 0.5

[sweep.env.reward_loss_white]
distribution = uniform
min = -2.0
max = -0.5
mean = -1.0
scale = 0.5

[sweep.env.reward_loss_black]
distribution = uniform
min = -2.0
max = -0.5
mean = -1.0
scale = 0.5

[sweep.env.reward_check_white]
distribution = uniform
min = 0.0
max = 0.5
mean = 0.2
scale = 0.25

[sweep.env.reward_check_black]
distribution = uniform
min = 0.0
max = 0.5
mean = 0.2
scale = 0.25

[sweep.env.reward_material_diff_white]
distribution = uniform
min = 0.0
max = 0.05
mean = 0.015
scale = 0.025

[sweep.env.reward_material_diff_black]
distribution = uniform
min = 0.0
max = 0.05
mean = 0.015
scale = 0.025

