[base]
package = ocean
env_name = puffer_sample_gym_env
policy_name = Policy
rnn_name = Recurrent

[env]
num_envs = 2048
size = 11
render_mode = None

[train]
total_timesteps = 100_000_000
gamma = 0.99
learning_rate = 0.003
minibatch_size = 16384
gae_lambda = 0.95
clip_coef = 0.2
ent_coef = 0.01
vf_coef = 0.5
max_grad_norm = 0.5

anneal_lr = True
num_steps = 128
num_minibatches = 4
update_epochs = 4

[vec]
backend = Multiprocessing

[policy]
hidden_size = 256

[rnn]
input_size = 256
hidden_size = 256
