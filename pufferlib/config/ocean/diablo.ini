[base]
package = ocean
env_name = puffer_diablo
policy_name = Diablo
rnn_name = Recurrent

[vec]
num_workers = 1
num_envs = 1
batch_size = 8
backend = PufferEnv

[policy]
cnn_channels = 32
hidden_size = 256

[rnn]
input_size = 256
hidden_size = 256

[env]
num_envs = 64
render_mode = human
view_radius = 10
game_ticks_per_step = 10
no_monsters = False
harmless_barrels = False
fixed_seed = False
diablo_build_path = /home/daa/pufferlib_diablo/DevilutionX-AI/build
mshared_filename = devilutionx-shared.mem

[train]
total_timesteps = 50_000_000
learning_rate = 5e-5
gamma = 0.99
gae_lambda = 0.99
clip_coef = 0.2
ent_coef = 0.01
vf_coef = 0.5
vf_clip_coef = 0.2
max_grad_norm = 1
anneal_lr = True
batch_size = 16384
minibatch_size = 4096
max_minibatch_size = 32768
bptt_horizon = 64
adam_beta1 = 0.9
adam_beta2 = 0.999
adam_eps = 1e-8
update_epochs = 1
prio_alpha = 0.0
prio_beta0 = 0.0
checkpoint_interval = 5
