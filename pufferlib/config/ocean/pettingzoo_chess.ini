[base]
package = ocean
env_name = puffer_pettingzoo_chess
policy_name = ChessRecurrent
rnn_name = ChessLSTM

[rnn]
input_size = 256
hidden_size = 256

[vec]
num_envs = 4
num_workers = 4
backend = Multiprocessing

[Ocean]
env_module = pufferlib.ocean.environment
env_class = make_pettingzoo_chess

[env]
# Environment settings
num_envs = 1024
render_mode = rgb_array
log_interval = 1
max_depth = 50

# Reward settings
reward_valid = 0.0
reward_invalid_white = -1.0
reward_invalid_black = -1.0
reward_agent_captures_enemy_piece = 0.0
reward_enemy_captures_agent_piece = 0.0
reward_draw = 0.0
reward_win_white = 1.0
reward_win_black = 1.0  
reward_loss_white = -1.0
reward_loss_black = -1.0
reward_check_white = 0.0
reward_check_black = 0.0
reward_material_diff_white = 0.0
reward_material_diff_black = 0.0

# Debug settings
debug_disable_mask = 0

# Stockfish settings
stockfish_enabled = 0
stockfish_cmd = ""
stockfish_elo = 800
stockfish_search_ms = 10
stockfish_hash_mb = 4

# Logging
full_game_logging_frequency = 5000000

# Self-play mode
self_play = True

[train]
minibatch_size = 4096
batch_size = 262144
bptt_horizon = 32