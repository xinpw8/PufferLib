[base]
package = ocean
env_name = puffer_boxoban
policy_name = Policy
rnn_name = Recurrent

[vec]
total_agents = 16384
num_buffers = 8
num_threads = 4

[policy]
num_layers = 3 
hidden_size = 256

[env]
num_agents = 1
#0 basic, 1 easy, 2 medium, 3 hard, 4 unfiltered
difficulty = 1
#reward per intermediate target (once per episode)
int_r_coeff = 0.25
#moving box off target
target_loss_pen_coeff = 0.0
max_steps = 300

 
[train]
anneal_lr = 1
beta1 = 0.9552949759646844
beta2 = 0.9953139311721624
clip_coef = 0.01
ent_coef = 0.00013933689574860213
eps = 0.00000000000153820701
gae_lambda = 0.19999999999999996
gamma = 0.986184084546895
gpus = 1
horizon = 32
learning_rate = 0.003776364420407994
max_grad_norm = 1.8486959069159363
min_lr_ratio = 0.37872027027338984
minibatch_size = 4096
prio_alpha = 0.8646505783469447
prio_beta0 = 0.8287716342217886
replay_ratio = 3.5359047237524988
seed = 42
total_timesteps = 41864993
use_rnn = true
vf_clip_coef = 5
vf_coef = 4.444818925590201
vtrace_c_clip = 4.2719952740551355
vtrace_rho_clip = 3.84374084727298

[sweep]
metric = perf

