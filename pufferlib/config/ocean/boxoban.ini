[base]
package = ocean
env_name = puffer_boxoban
policy_name = Policy
rnn_name = Recurrent

[vec]
total_agents = 16384
num_buffers = 8
num_threads = 2

[policy]
num_layers = 2 
hidden_size = 256

[env]
num_agents = 1
#0 basic, 1 easy, 2 medium, 3 hard, 4 unfiltered
difficulty = 1
#reward per intermediate target (once per episode)
int_r_coeff = 0.25
#moving box off target
target_loss_pen_coeff = 0.0
max_steps = 300

 
[train]
#EASY
anneal_lr = 1
beta1 = 0.9524080120922038
beta2 = 0.9938151282804136
clip_coef = 0.4770373231152628
ent_coef = 0.00001
eps = 0.00000000000001
gae_lambda = 0.8032589838049962
gamma = 0.965698161834
gpus = 1
horizon = 64
learning_rate = 0.002557505571664044
max_grad_norm = 0.1
min_lr_ratio = 0.37872027027338984
minibatch_size = 8192
prio_alpha = 0.9556021765385548
prio_beta0 = 1
replay_ratio = 4
seed = 42
total_timesteps = 53251895
use_rnn = true
vf_clip_coef = 4.856116827195164
vf_coef = 5
vtrace_c_clip = 2.5648427343944147
vtrace_rho_clip = 3.258932255953648

[sweep]
metric = perf

