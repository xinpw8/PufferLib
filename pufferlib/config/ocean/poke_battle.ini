[base]
package = ocean
env_name = puffer_poke_battle
policy_name = PokeBattle
rnn_name = PokeBattleLSTM

[vec]
backend = PufferEnv
num_envs = 1

# backend = Multiprocessing
# num_envs = 20
# num_workers = 20
# batch_size = 20

[env]
selfplay = 0
num_envs = 8192 # 16384 # 8192 # 4096
# num_envs = 128
# bot_mode: 0=random, 1=heuristic (1-ply minimax), 2=mcts
# Only used in non-selfplay mode (selfplay uses policy pool)
bot_mode = 0
mcts_iterations = 128
mcts_depth = 5

[policy]
hidden_size = 256

[rnn]
input_size = 256
hidden_size = 256

[train]
total_timesteps = 1_000_000_000
learning_rate = 0.0003
anneal_lr = True
gamma = 0.99
gae_lambda = 0.95
update_epochs = 2
clip_coef = 0.2
ent_coef = 0.01
vf_coef = 0.5
bptt_horizon = 128

horizon = 128
replay_ratio = 1.0
beta1 = 0.99
beta2 = 0.9999
eps = 0.0001
prio_alpha = 0.8
prio_beta0 = 0.1
vtrace_c_clip = 2.0
vtrace_rho_clip = 1.1

minibatch_size = 32_768 # 16384 # 8192 # 4096
# batch_size = 2097152 # 1048576 # 524288
# minibatch_size = 4096
batch_size = auto


### Targeted sweep
[sweep]
method = Protein
metric = reached_65536
goal = maximize
downsample = 5
max_suggestion_cost = 3600
sweep_only = scaffolding_ratio, learning_rate, replay_ratio, horizon, minibatch_size, total_agents, hidden_size, num_layers, ent_coef, vf_coef

[sweep.env.scaffolding_ratio]
distribution = uniform
min = 0.45
mean = 0.67
max = 0.85
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.0001
mean = 0.000467
max = 0.001
scale = auto

[sweep.train.max_grad_norm]
distribution = uniform
min = 0.3
mean = 0.6
max = 1.2
scale = auto

[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 256
max = 1024
scale = auto

[sweep.policy.num_layers]
distribution = int_uniform
min = 1
max = 2
scale = auto

[sweep.vec.total_agents]
distribution = uniform_pow2
min = 4096
max = 32768
scale = auto

[sweep.vec.num_threads]
distribution = int_uniform
min = 2
max = 8
scale = auto

[sweep.vec.num_buffers]
distribution = int_uniform
min = 1
max = 4
scale = auto

[sweep.train.horizon]
distribution = uniform_pow2
min = 32
max = 128
scale = auto

[sweep.train.minibatch_size]
distribution = uniform_pow2
min = 16384
max = 65536
scale = auto

[sweep.train.replay_ratio]
distribution = uniform
min = 0.75
max = 2.0
scale = auto

[sweep.train.ent_coef]
distribution = log_normal
min = 0.005
mean = 0.02
max = 0.08
scale = auto

[sweep.train.vf_coef]
distribution = uniform
min = 0.5
mean = 2.0
max = 3.0
scale = auto