[base]
package = ocean
env_name = puffer_poke_battle
policy_name = PokeBattle
rnn_name = PokeBattleLSTM

[vec]
backend = PufferEnv
num_envs = 1

[env]
selfplay = 1
num_envs = 4096
# bot_mode: 0=random, 1=heuristic (1-ply minimax), 2=mcts
# Only used in non-selfplay mode (selfplay uses policy pool)
bot_mode = 0
mcts_iterations = 128
mcts_depth = 5

[policy]
hidden_size = 256

[rnn]
input_size = 256
hidden_size = 256

[train]
total_timesteps = 50_000_000
learning_rate = 0.0003
anneal_lr = True
gamma = 0.99
gae_lambda = 0.95
update_epochs = 1
clip_coef = 0.2
ent_coef = 0.01
vf_coef = 0.5
bptt_horizon = 16
minibatch_size = 4096
batch_size = 524288
