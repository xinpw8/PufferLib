# Pure self-play: learner vs policy snapshots only. No external opponents, no curriculum, no imitation.

[base]
package = ocean
env_name = puffer_chess
policy_name = ChessTwo

[vec]
total_agents = 16384
num_buffers = 8
num_threads = 128

[env]
selfplay = 1
turn_gating = 1
random_bot = 0
stockfish_bot = 0
stockfish_limit_strength = 0
stockfish_elo = 1320
stockfish_movetime_ms = 0
stockfish_depth = 1
stockfish_pool_size = -1
stockfish_random_pct = 0
stockfish_query_pct = 0
chess_encoder = 2
max_moves = 5000
enable_threefold_repetition = 1
enable_50_move_rule = 1
gpu_opponent = 0
builtin_noise_cp = 30
builtin_depth = 2
reward_draw = -0.5
reward_material = 0.05
reward_check = 0.01
reward_mate = 0.0
reward_syzygy = 0.5
reward_repetition = -0.3
reward_invalid_piece = 0.0
reward_invalid_move = 0.0
fen_curric_pct = 0
deepmind_fen_pct = 0
reward_tutor_piece = 0
reward_tutor_move = 0
reward_tutor_wrong = 0
tutor_only_mode = 0
mate_curriculum = 0
reward_mate_fail = -0.5
mate_advance_threshold = 0.50
reward_mate_progress = 0.5
mate_retry = 1
mate_mix_floor = 0.65
puzzle_drill_mode = 0
puzzle_piece_reward_0 = 0.1
puzzle_dest_reward_0 = 0.15
puzzle_reward_increment = 0.1
puzzle_drill_levels = 3
use_action_masking = 1

[policy]
cnn_channels = 256
hidden_size = 256
embed_dim = 32
use_action_masking = 1

[train]
total_timesteps = 50_000_000_000
checkpoint_interval = 25
horizon = 256
cudagraphs = -1
learning_rate = 0.0002
gamma = 0.9998
gae_lambda = 0.91
ent_coef = 0.10
vf_coef = 2.64
clip_coef = 0.24
reward_clip = 10.0
vf_clip_coef = 0.83
vtrace_rho_clip = 1.66
vtrace_c_clip = 2.91
