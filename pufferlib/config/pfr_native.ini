[base]
package = ocean
env_name = puffer_pfr_native
policy_name = PfrNativePolicy
rnn_name = Recurrent

[vec]
backend = PufferEnv
num_envs = 1
num_buffers = 4
num_threads = 4

[env]
num_envs = 4096
report_interval = 128
heatmap_interval = 50

[policy]
hidden_size = 128
num_layers = 4
tile_embed_dim = 4

[train]
total_timesteps = 20_000_000_000
learning_rate = 3e-5
ent_coef = 0.2
clip_coef = 0.2
vf_coef = 0.1
vf_clip_coef = 0.5
cudagraphs = -1
kernels = True
gamma = 0.99
gae_lambda = 0.95
