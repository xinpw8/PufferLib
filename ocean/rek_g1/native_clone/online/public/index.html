<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>REK Online</title><link rel="stylesheet" href="/style.css">
<script src="/controls.js" defer></script><script type="module" src="/client.js"></script></head>
<body class="game-page">
<canvas id="view" tabindex="0" aria-label="Arena. Click, then use the keyboard to control your robot."></canvas>
<header class="hud-top">
  <div class="fighter blue"><span id="name-0">Fighter 1</span><strong id="points-0">0</strong><small><span id="wins-0">0</span> rounds · <span id="falls-0">0</span> falls</small></div>
  <div class="round"><strong id="clock">2:00</strong><span id="round-status">Connecting</span></div>
  <div class="fighter orange"><span id="name-1">Fighter 2</span><strong id="points-1">0</strong><small><span id="wins-1">0</span> rounds · <span id="falls-1">0</span> falls</small></div>
</header>
<section id="overlay" class="overlay" aria-live="polite">
  <h1 id="overlay-title">Loading arena</h1>
  <p id="overlay-text"></p>
  <button id="fight-bot" class="primary" hidden>Fight Bot 1</button>
</section>
<div id="attack" class="attack" aria-live="polite"></div>
<footer class="hud-bottom">
  <span id="connection">Connecting</span><span id="ping">ping –</span><span id="rate">sim –</span>
  <button id="toggle-help" aria-expanded="false">Controls</button><button id="toggle-view">View: lock-on</button><a href="/logout">Log out</a>
</footer>
<aside id="help" class="help" hidden>
  <h2>Controls</h2>
  <p><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move · <kbd>Q</kbd><kbd>E</kbd> turn · <kbd>X</kbd> cancel attack · <kbd>V</kbd> camera (lock-on, follow, overview)</p>
  <p>Hold <kbd>Space</kbd> for combos. Double-tap kick keys within 300 ms.</p>
  <div id="moves" class="moves"></div>
</aside>
</body></html>
