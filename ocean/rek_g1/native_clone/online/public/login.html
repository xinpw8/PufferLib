<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>REK Online</title><link rel="stylesheet" href="/style.css"></head>
<body class="login-page"><main class="login">
<h1>REK Online</h1>
<p>Robot sparring. Two players fight each other; one player can fight Bot 1.</p>
<!--MESSAGE-->
<form method="post" action="/login">
  <label>Name<input name="name" maxlength="20" autocomplete="nickname" placeholder="Player"></label>
  <label>Password<input name="password" type="password" required autocomplete="current-password" autofocus></label>
  <button class="primary" type="submit">Enter</button>
</form>
</main></body></html>
