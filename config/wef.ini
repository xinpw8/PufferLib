[base]
env_name = wef

[vec]
total_agents = 4096
num_buffers = 4
num_threads = 16

[policy]
num_layers = 3
hidden_size = 128

[train]
total_timesteps = 100_000_000

[env]
num_agents = 4
# Set min=max for evaluation; use 40 and 300 for paper-style training.
min_arena_width = 70
max_arena_width = 70
min_arena_height = 70
max_arena_height = 70
# 0=uniform, 1=patchy, 2=random
food_distribution = 2
num_food = 64
# Patchy distribution parameters.
patch_radius = 6
patch_radius_std = 1.5
patch_density = 0.001
electric_field_radius = 15
# Influence ranges (cm) for electric field calculations.
reflection_wall_range = 100
field_fish_range = 100
field_food_range = 5
episode_length = 512
