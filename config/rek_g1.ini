[base]
# Native two-fighter semantic candidate. Held-out REK trajectory parity has not
# been established, so training remains disabled below.
env_name = rek_g1

[vec]
total_agents = 8
num_buffers = 1
num_threads = 4

[env]
max_steps = 500
physics_workers = 4
# One 20 ms segment preserves per-tick agent control. Repeating a locomotion
# category represents a held key rather than imposing an unmeasured fixed hold.
locomotion_segment_ticks = 1
# Heading forgiveness is the exact zero recovered for this client build. Fall
# detection is measured from MuJoCo root, floor, and contact state. The current
# G1 has CanGetUp=false: a committed fall suspends Sonic, applies the recovered
# 0.1 dampening retention, and enters the recovered 3 s referee count. The
# candidate currently resets the arena immediately after count resolution;
# REK's one-FixedUpdate deferred joint reset remains an explicit parity gate.
# These are reconstructed compositor traversal ticks. They are not measured
# input-to-physical-response durations from the current REK service.
kick_move_6_duration_ticks = 157
kick_move_7_duration_ticks = 145
kick_move_8_duration_ticks = 158
kick_move_9_duration_ticks = 139

[policy]
hidden_size = 256
num_layers = 2
expansion_factor = 1

[torch]
network = MLP
encoder = DefaultEncoder
decoder = DefaultDecoder

[train]
gpus = 0
seed = 42
total_timesteps = 0
learning_rate = 0.0003
anneal_lr = 1
min_lr_ratio = 0
gamma = 0.99
gae_lambda = 0.95
replay_ratio = 1
clip_coef = 0.2
vf_coef = 0.5
vf_clip_coef = 1.0
max_grad_norm = 0.5
ent_coef = 0.001
beta1 = 0.9
beta2 = 0.999
eps = 1e-8
minibatch_size = 512
horizon = 64
vtrace_rho_clip = 1.0
vtrace_c_clip = 1.0
prio_alpha = 0.5
prio_beta0 = 0.5
