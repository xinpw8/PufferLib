[base]
# Dynamics-only diagnostic. It is not a behavioral REK clone or training task.
env_name = rek_g1

[vec]
total_agents = 8
num_buffers = 1
num_threads = 4

[env]
max_steps = 500

[policy]
hidden_size = 256
num_layers = 2
expansion_factor = 1

[torch]
network = MLP
encoder = DefaultEncoder
decoder = DefaultDecoder

[train]
gpus = 0
seed = 42
total_timesteps = 0
learning_rate = 0.0003
anneal_lr = 1
min_lr_ratio = 0
gamma = 0.99
gae_lambda = 0.95
replay_ratio = 1
clip_coef = 0.2
vf_coef = 0.5
vf_clip_coef = 1.0
max_grad_norm = 0.5
ent_coef = 0.001
beta1 = 0.9
beta2 = 0.999
eps = 1e-8
minibatch_size = 512
horizon = 64
vtrace_rho_clip = 1.0
vtrace_c_clip = 1.0
prio_alpha = 0.5
prio_beta0 = 0.5
