[base]
env_name = breakout
async = 1
# Data lag (epochs): 1 = Cleanba 2-slot; K>1 = ring of K+1 slots.
async_data_lag = 1
# Multi-seed repro of fastest sweep >850 (seed1 of top#1).
seed = 1

[vec]
total_agents = 2048
num_buffers = 1
num_threads = 8
gpu_env = 1

[policy]
num_layers = 4
hidden_size = 64

[env]
num_agents = 1
frameskip = 3
width = 576
height = 330
initial_paddle_width = 62
paddle_width = 62
paddle_height = 8
ball_width = 32
ball_height = 32
brick_width = 32
brick_height = 12
brick_rows = 6
brick_cols = 18
initial_ball_speed = 256
max_ball_speed = 448
paddle_speed = 620
continuous = 0

[train]
# Fastest sweep >850: sweep_1786403754325_0375 (~1.9s, multi-seed mean ~851).
# Stack: per-mb + live V + full V-trace + classic PPO + muon_rel + raw A.
total_timesteps = 30000006
learning_rate = 1.0
gamma = 0.972840071
gae_lambda = 0.965954483
replay_ratio = 3.34128666
clip_coef = 0.9
vf_coef = 4.0
vf_clip_coef = 4.10105276
max_grad_norm = 1.23414445
ent_coef = 0.00349850394
momentum = 0.722294152
muon_rel = 1
advantage_per_mb = 1
advantage_live_v = 1
advantage_is = 1
# Batch A whitening off. Running reward-std scale of PG A off by default.
normalize_advantages = 0
reward_std_scale = 0
reward_scale_max = 0
minibatch_size = 32768
horizon = 32
prio_alpha = 0
prio_beta0 = 0.534311116
vtrace_c_clip = 1.0
vtrace_rho_clip = 1.0

[sweep]
max_suggestion_cost = 3

[sweep.train.total_timesteps]
distribution = log_normal
min = 3e7
max = 2e8
mean = 8e7
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.00001
max = 1.0
scale = 0.5

[sweep.env.frameskip]
distribution = int_uniform
min = 1
max = 8
mean = 4
scale = 2.0
