[base]
env_name = rek
checkpoint_interval = 100

# Selfplay pool: most envs are pure selfplay, a slice plays frozen historical
# snapshots so the policy cannot collapse into beating only its current self.
[selfplay]
enabled = 1
max_size = 200
swap_winrate = 0.6
min_games = 4096
elo_init = 0
elo_k = 16
seed = 42
snapshot_interval = 100_000_000
opp_timeout_steps = 400_000_000

[vec]
total_agents = 16384
num_buffers = 4
num_threads = 4
num_frozen_banks = 1
frozen_bank_pct = 0.1

[env]
num_agents = 2
num_bots = 0
bot_policy = 0

# REK match rules
round_seconds = 60

# Arena and body geometry, metres. Unitree G1 is ~1.32 m tall; body_radius is
# the standing footprint used for both collision and hit resolution.
arena_radius = 3.0
body_radius = 0.28

# Locomotion and balance. Placeholders until tools/extract_rek.py pins them to
# REK's real values — all are swept below rather than trusted.
move_speed = 1.4
guard_speed_mult = 0.5
accel = 0.35
friction = 0.82
turn_rate = 0.18
balance_decay = 0.02
guard_balance_mult = 0.35
hitstun_frames = 6
getup_frames = 45

# Rewards. The win bonus is the real objective; the rest is shaping.
reward_hit = 0.1
reward_hit_taken = -0.1
reward_down = -0.3
reward_down_dealt = 0.3
reward_win = 1.0
reward_guard = 0.0

# Domain randomisation scale. 0 disables; match() forces it to 0 for eval.
dr = 1.0

[policy]
hidden_size = 256
num_layers = 4
expansion_factor = 1

[train]
gpus = 1
seed = 42
total_timesteps = 2_000_000_000
learning_rate = 0.001
anneal_lr = 1
min_lr_ratio = 0.1
gamma = 0.995
gae_lambda = 0.90
replay_ratio = 1.0
clip_coef = 0.2
vf_coef = 2.0
vf_clip_coef = 0.2
max_grad_norm = 1.5
ent_coef = 0.01
anneal_ent_coef = 1
min_ent_coef_ratio = 0.1
beta1 = 0.95
beta2 = 0.999
eps = 1e-12
minibatch_size = 32768
horizon = 64
vtrace_rho_clip = 1.0
vtrace_c_clip = 1.0
prio_alpha = 0.8
prio_beta0 = 0.6

# The physics constants are the calibration surface to REK. Sweeping them
# finds a policy robust across the range REK plausibly sits in, rather than
# one tuned to a guess.
[sweep.env.move_speed]
distribution = log_normal
min = 0.6
max = 3.0
mean = 1.4
scale = auto

[sweep.env.balance_decay]
distribution = log_normal
min = 0.005
max = 0.1
mean = 0.02
scale = auto

[sweep.env.guard_balance_mult]
distribution = log_normal
min = 0.05
max = 1.0
mean = 0.35
scale = auto

[sweep.env.reward_hit]
distribution = log_normal
min = 0.01
max = 1.0
mean = 0.1
scale = auto

[sweep.env.reward_down]
distribution = log_normal
min = 0.05
max = 2.0
mean = 0.3
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 1e-4
max = 1e-2
mean = 1e-3
scale = auto
