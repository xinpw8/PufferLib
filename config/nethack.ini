[base]
env_name = nethack
reset_every_horizon = 0
async = 1

[vec]
total_agents = 256
num_buffers = 4
#num_threads = 8
num_threads = 32
action_mask_size = 690

[env]
gold_coef = 1
exp_coef = 0.0222526733
descent_coef = 4.57267237
xp_coef = 0.648124218
scout_coef = 0.1
hp_coef = 0.00617194036
hunger_coef = 0.01
illegal_penalty = -0.01
death_penalty = -0.112676442
ac_coef = 1.0
heal_coef = 0.001
status_coef = 0.0116204191

[policy]
hidden_size = 512
num_layers = 3

[train]
#total_timesteps = 166275056
total_timesteps = 4_000_000_000
minibatch_size = 16384
horizon = 512
learning_rate = 0.00175767997
gamma = 0.993521929
gae_lambda = 0.611256123
replay_ratio = 2.42882919
clip_coef = 0.478926629
vf_coef = 2.29309034
vf_clip_coef = 3.19970345
max_grad_norm = 1.43588173
ent_coef = 0.0192690529
beta1 = 0.9694917707305044
beta2 = 0.9475724955192064
eps = 0.0001
prio_alpha = 0.931300879
prio_beta0 = 0.885229468

[sweep]
metric = max_depth

[sweep.train.total_timesteps]
distribution = log_normal
min = 1.5e8
max = 4e8
scale = time

[sweep.env.gold_coef]
distribution = log_normal
min = 0.001
max = 1.0
scale = auto

[sweep.env.exp_coef]
distribution = log_normal
min = 0.01
max = 10.0
scale = auto

[sweep.env.descent_coef]
distribution = log_normal
min = 0.5
max = 10.0
scale = auto

[sweep.env.xp_coef]
distribution = log_normal
min = 0.05
max = 1.0
scale = auto

[sweep.env.scout_coef]
distribution = log_normal
min = 0.0001
max = 0.1
scale = auto

[sweep.env.hp_coef]
distribution = log_normal
min = 0.0005
max = 0.06
scale = auto

[sweep.env.hunger_coef]
distribution = log_normal
min = 0.01
max = 0.25
scale = auto

[sweep.env.illegal_penalty]
distribution = uniform
min = -0.01
max = 0.0
scale = auto

[sweep.env.death_penalty]
distribution = uniform
min = -1.0
max = 0.0
scale = auto

[sweep.env.heal_coef]
distribution = log_normal
min = 0.001
max = 0.1
scale = auto

[sweep.env.status_coef]
distribution = log_normal
min = 0.01
max = 1.0
scale = auto

[sweep.env.ac_coef]
distribution = log_normal
min = 0.01
max = 0.5
scale = auto
