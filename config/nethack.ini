[base]
env_name = nethack
# carry semantics. NOTE: the 4.0 train block below collapsed under carry
# in the 2026-07-31 probe (kl ~1.8 by 100M; healthy with wipe) — lr likely
# needs retuning for carry (upstream's carry block: comments in [train]).
reset_every_horizon = 0
async = 0

[vec]
total_agents = 512
num_buffers = 4
#num_threads = 8
num_threads = 32
action_mask_size = 730

# champion reward (floor-reward descent + our sweep-tuned coefs). NOTE: the
# [train] block below is upstream's carry-tuned set — co-adapted to their
# max-depth reward; resweep pending.
[env]
gold_coef = 0.021659979757862095
exp_coef = 0.08341832601491733
descent_coef = 1.9586073647172169
floor_coef = 0.0
xp_coef = 0.5926087261188399
scout_coef = 0.07425725927605491
hp_coef = 0.016768633120843694
hunger_coef = 0.04373640516193193
illegal_penalty = -0.009138756699997636
death_penalty = -0.8209825710553373
ac_coef = 0.0508544124054636
heal_coef = 0.001
status_coef = 0.01

[policy]
hidden_size = 512
num_layers = 3

# 4.0 champion train block (wipe-tuned; recert ref on the 4.0 tree 6403.19).
# Upstream's carry-tuned set for reset_every_horizon=0 experiments was:
#   horizon 512, minibatch 16384, lr 0.00175767997, gamma 0.993521929,
#   lambda 0.611256123, replay 2.42882919, clip 0.478926629, vf 2.29309034,
#   vf_clip 3.19970345, grad_norm 1.43588173, ent 0.0192690529,
#   beta1 0.9694917707305044, beta2 0.9475724955192064, eps 0.0001,
#   prio 0.931300879/0.885229468 (co-adapted to their max-depth reward)
[train]
total_timesteps = 247765094
minibatch_size = 32768
horizon = 64
learning_rate = 0.011854702184553156
# 5c muon reads train.momentum (NOT beta1); 4.0 fed beta1 as muon momentum
momentum = 0.805399553172738
verb_eps = 0.005
verb_eps_anneal_start = 0.4
verb_eps_anneal_end = 1.0
gamma = 0.9973714278257158
gae_lambda = 0.7339946788354172
replay_ratio = 1.036717410123433
clip_coef = 1.0
vf_coef = 1.8486010633248169
vf_clip_coef = 4.624607731543118
max_grad_norm = 0.902165688849037
ent_coef = 0.008389210353641681
beta1 = 0.805399553172738
beta2 = 0.999139492311758
eps = 1e-14
vtrace_rho_clip = 2.770648671516198
vtrace_c_clip = 4.5026502564349595
prio_alpha = 0.6754855924309153
prio_beta0 = 0.8672463883417074

[sweep]
metric = score

[sweep.train.total_timesteps]
distribution = log_normal
min = 1.5e8
max = 4e8
scale = time

[sweep.env.gold_coef]
distribution = log_normal
min = 0.001
max = 1.0
scale = auto

[sweep.env.exp_coef]
distribution = log_normal
min = 0.01
max = 10.0
scale = auto

[sweep.env.descent_coef]
distribution = log_normal
min = 0.5
max = 10.0
scale = auto

[sweep.env.xp_coef]
distribution = log_normal
min = 0.05
max = 1.0
scale = auto

[sweep.env.scout_coef]
distribution = log_normal
min = 0.0001
max = 0.1
scale = auto

[sweep.env.hp_coef]
distribution = log_normal
min = 0.0005
max = 0.06
scale = auto

[sweep.env.hunger_coef]
distribution = log_normal
min = 0.01
max = 0.25
scale = auto

[sweep.env.illegal_penalty]
distribution = uniform
min = -0.01
max = 0.0
scale = auto

[sweep.env.death_penalty]
distribution = uniform
min = -1.0
max = 0.0
scale = auto

[sweep.env.heal_coef]
distribution = log_normal
min = 0.001
max = 0.1
scale = auto

[sweep.env.status_coef]
distribution = log_normal
min = 0.01
max = 1.0
scale = auto

[sweep.env.ac_coef]
distribution = log_normal
min = 0.01
max = 0.5
scale = auto
