[base]
# High-level T800 fight env on the recovered MuJoCo plant.
env_name = rek_fight

[vec]
total_agents = 64
num_buffers = 1
num_threads = 16

[env]
max_steps = 1500
fall_height = 0.5
fall_up_z = 0.5
root_stabilizer_scale = 1.0

[policy]
hidden_size = 256
num_layers = 2
expansion_factor = 1

[torch]
network = MLP
encoder = DefaultEncoder
decoder = DefaultDecoder

[train]
gpus = 1
seed = 42
total_timesteps = 16_777_216
learning_rate = 0.0003
anneal_lr = 1
min_lr_ratio = 0
gamma = 0.99
gae_lambda = 0.95
replay_ratio = 1
clip_coef = 0.2
vf_coef = 0.5
vf_clip_coef = 1.0
max_grad_norm = 0.5
ent_coef = 0.01
beta1 = 0.9
beta2 = 0.999
eps = 1e-8
minibatch_size = 2048
horizon = 64
vtrace_rho_clip = 1.0
vtrace_c_clip = 1.0
prio_alpha = 0.5
prio_beta0 = 0.5
