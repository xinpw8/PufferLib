total_timesteps = 5_000_000
learning_rate = 0.0015
anneal_lr = 1
min_lr_ratio = 0
gamma = 0.9995
gae_lambda = 0.98
replay_ratio = 2
clip_coef = 0.1
vf_coef = 2.0
vf_clip_coef = 0.3
max_grad_norm = 0.7
ent_coef = 0.001
anneal_ent_coef = 1
