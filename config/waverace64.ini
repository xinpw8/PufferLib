[base]
env_name = waverace64
seed = 42
eval_episodes = 32
eval_agents = 32
checkpoint_interval = 512

[vec]
total_agents = 128
num_buffers = 1
num_threads = 16

[env]
rom_path = ../baserom.us.rev1.z64
frameskip = 4
discount = 0.999
reward_speed = 0.0
reward_progress = 1.0
reward_slip = 0.0
reward_checkpoint = 0.1
reward_miss = 0.5
reward_finish = 10.0
reward_fail = 2.0

[policy]
hidden_size = 128
num_layers = 2

[train]
gpus = 1
total_timesteps = 5_000_000
learning_rate = 0.0015
anneal_lr = 1
min_lr_ratio = 0
gamma = 0.999
gae_lambda = 0.95
replay_ratio = 2
clip_coef = 0.1
vf_coef = 2.0
vf_clip_coef = 0.3
max_grad_norm = 0.7
ent_coef = 0.001
momentum = 0.9
minibatch_size = 1024
horizon = 32
vtrace = 0
