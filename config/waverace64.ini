[base]
env_name = waverace64
seed = 42
async = 1
eval_episodes = 32
eval_agents = 32
checkpoint_interval = 256

[vec]
total_agents = 128
num_buffers = 1
num_threads = 16

[env]
rom_path = ../baserom.us.rev1.z64
frameskip = 4
discount = 0.9995
reward_speed = 0.0
reward_progress = 1.0
reward_slip = 0.0
