[base]
env_name = drmario

[vec]
total_agents = 4096
num_threads = 2

[env]
n_rows = 16
n_cols = 8
n_init_viruses = 4

[policy]
hidden_size = 256
num_layers = 2

[train]
total_timesteps = 500_000_000
learning_rate = 0.001
gamma = 0.99
gae_lambda = 0.95
clip_coef = 0.2
vf_coef = 0.5
ent_coef = 0.01
minibatch_size = 32768
horizon = 128
use_rnn = 1

[sweep]
metric = perf
goal = maximize