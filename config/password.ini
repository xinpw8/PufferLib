[base]
package = ocean
env_name = password

[vec]
total_agents = 4096
num_buffers = 2
num_threads = 8

[policy]
hidden_size = 128
num_layers = 2

[train]
total_timesteps = 100_000_000
learning_rate = 0.003
gamma = 0.99
gae_lambda = 0.95
replay_ratio = 1.0
minibatch_size = 32768
horizon = 64
ent_coef = 0.01
prio_alpha = 0.0
prio_beta0 = 1.0

#state_buffer_size = 100_000
#cl_frac = 0.8
#warmup_states = 10_000
#explore_alpha = 0.8
#explore_beta = 0.0

[sweep]
metric = score
goal = maximize
