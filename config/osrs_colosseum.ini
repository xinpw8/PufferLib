curriculum_wave_5 = 6
curriculum_frac_5 = 0.0

[vec]
total_agents = 8192
num_buffers = 8
num_threads = 32
action_mask_size = 452
gpu_env = 0

[policy]
hidden_size = 256
num_layers = 2
expansion_factor = 1

[train]
total_timesteps = 360785504
horizon = 32
min_lr_ratio = 0.0598145202
learning_rate = 0.000741419091
momentum = 0.984893203
ent_coef = 2.93842027e-06
gamma = 0.999876142
gae_lambda = 0.979838431
vtrace_rho_clip = 1.65516651
vtrace_c_clip = 0.573781013
prio_alpha = 0.571603894
prio_beta0 = 0.00201839209
clip_coef = 0.0961709544
vf_coef = 8
vf_clip_coef = 0.0481410585
max_grad_norm = 6.59531498
replay_ratio = 3.97566438
minibatch_size = 8192

[sweep]
max_suggestion_cost = 3600
max_runs = 400
gpus = 1
early_stop_quantile = 0.25

[sweep.train.total_timesteps]
distribution = log_normal
min = 10_000_000
max = 2_000_000_000
scale = time

[sweep.env.damage_reward_coeff]
distribution = log_normal
min = 0.00001
max = 0.010
scale = auto

[sweep.env.wave_clear_bonus]
distribution = uniform
min = 0.0
max = 1.0
scale = auto

[sweep.env.win_bonus]
distribution = uniform
min = 0.0
max = 1.0
scale = auto

[sweep.env.boss_phase_bonus]
distribution = uniform
min = 0.0
max = 1.0
scale = auto

[sweep.env.death_penalty_coeff]
distribution = uniform
min = 0.0
max = 1.0
scale = auto

[sweep.env.timeout_penalty]
distribution = uniform
min = 0.0
max = 1.0
scale = auto

# Ceiling was 8.0 and the top 20 of the 20260803 sweep ran 7.3 to 8.0, median exactly 8.0.
# A dim pinned on its own boundary is not an answer, it is a range that ran out.
[sweep.train.vf_coef]
distribution = uniform
min = 0.1
max = 24.0
scale = auto

[sweep.train.vf_clip_coef]
distribution = uniform
min = 0.000002
max = 1.0
scale = auto

# 1024 and 2048 put nothing in the top 20 across 210 trials, so the head of the range was
# only ever buying wall clock. The floor drops instead: obs 1258 -> 922 bought the most where
# the env dominates the step, which is the small-hidden end, so the knee may have moved down.
[sweep.policy.hidden_size]
distribution = uniform_pow2
min = 128
max = 1024
scale = auto

[sweep.train.horizon]
distribution = uniform_pow2
min = 8
max = 128
scale = auto

[sweep.train.learning_rate]
distribution = log_normal
min = 0.00003
max = 0.004
scale = 0.5

[sweep.train.ent_coef]
distribution = log_normal
min = 0.00000001
max = 0.002
scale = auto

[sweep.train.gamma]
distribution = logit_normal
min = 0.995
max = 0.99997
scale = auto

[sweep.train.gae_lambda]
distribution = logit_normal
min = 0.05
max = 0.999
scale = auto

[sweep.train.min_lr_ratio]
distribution = uniform
min = 0.0
max = 0.9
scale = auto

[sweep.train.clip_coef]
distribution = uniform
min = 0.001
max = 0.12
scale = auto

[sweep.train.max_grad_norm]
distribution = uniform
min = 0.3
max = 8.0
scale = auto

[sweep.train.replay_ratio]
distribution = uniform
min = 1.5
max = 6.0
scale = auto

[sweep.env.curriculum_frac_1]
distribution = uniform
min = 0.0
max = 0.30
scale = auto

[sweep.env.curriculum_frac_2]
distribution = uniform
