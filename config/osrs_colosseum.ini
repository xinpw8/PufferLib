damage_scale_anneal_start = 1.0
damage_scale_anneal_ticks = 0
classic_curriculum_mode = 1
curriculum_num_tiers = 4
curriculum_wave_1 = 11
curriculum_frac_1 = 0.0574102551
curriculum_wave_2 = 5
