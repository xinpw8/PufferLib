[base]
package = ocean
env_name = boids
policy_name = Policy
rnn_name = Recurrent

[env]
num_envs = 64
num_agents = 64
report_interval = 1
margin_turn_factor = 1.0
cohesion_factor = 0.6
separation_factor = 1.4
alignment_factor = 0.8

[vec]
total_agents = 4096
num_buffers = 8
num_threads = 8

[train]
total_timesteps = 20_000_000
gamma = 0.98
learning_rate = 0.01
minibatch_size = 16384

[sweep]
method = Protein
metric = score
sweep_only = margin_turn_factor, cohesion_factor, separation_factor, alignment_factor

[sweep.train.total_timesteps]
distribution = log_normal
min = 1e3
max = 1e7
scale = time

[sweep.env.margin_turn_factor]
distribution = log_normal
min = 0.01
max = 5.0
scale = auto

[sweep.env.cohesion_factor]
distribution = log_normal
min = 0.1
max = 2
scale = auto

[sweep.env.separation_factor]
distribution = log_normal
min = 0.2
max = 3
scale = auto

[sweep.env.alignment_factor]
distribution = log_normal
min = 0.1
max = 2
scale = auto
