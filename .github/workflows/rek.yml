# CI for ocean/rek.
#
# The existing install workflow runs `pip install -e .` and nothing else, so it
# is insensitive to everything in this env: it stayed green while the build was
# broken for the machine this env is meant to train on. This one builds the env,
# runs its rules, and cross-compiles it for aarch64 so that break cannot come
# back unnoticed.

name: rek

on:
  push:
    paths:
      - 'ocean/rek/**'
      - 'build.sh'
      - 'src/**'
      - '.github/workflows/rek.yml'
  pull_request:
    paths:
      - 'ocean/rek/**'
      - 'build.sh'
      - 'src/**'
      - '.github/workflows/rek.yml'

jobs:
  env:
    name: build and check rules
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang libgl1-mesa-dev libx11-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libomp-dev

      - name: Build the standalone env
        run: ./build.sh rek --fast

      - name: Check the rules
        # Headless: no window, no GPU, no display. Covers scoring, the down and
        # knockout rules, the round clock, observation layout, chassis geometry
        # against the measured URDF values, and matchup pinning.
        run: |
          clang -O2 -DNDEBUG -Wall -Wextra -Iocean/rek -o test_rek \
            ocean/rek/test_rek.c -lm
          ./test_rek

      - name: Check the asset extractor
        run: python3 ocean/rek/tools/test_extract_rek.py

      - name: Shell-check the tooling
        run: |
          for f in ocean/rek/tools/*.sh ocean/rek/tools/arm64/*.sh \
                   ocean/rek/tools/arm64/puffer-cc; do
            bash -n "$f"
          done

  aarch64:
    name: cross-compile for aarch64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install cross toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang gcc-aarch64-linux-gnu

      - name: Fetch raylib headers
        # Headers only, and they are architecture independent — this job never
        # links. build.sh names this directory, and its download() skips when it
        # already exists, which is the same hook prepare_arm64.sh uses.
        run: |
          curl -sL -o raylib.tar.gz \
            https://github.com/raysan5/raylib/releases/download/5.5/raylib-5.5_linux_amd64.tar.gz
          tar xf raylib.tar.gz && rm raylib.tar.gz

      - name: Confirm the x86-only flags are still the blocker
        # build.sh compiles with (-mavx2 -mfma) unconditionally. If this ever
        # stops failing, the shim has become unnecessary and can go.
        run: |
          if clang --target=aarch64-linux-gnu --sysroot=/usr/aarch64-linux-gnu \
              -mavx2 -mfma -O2 -I. -Isrc -Iocean/rek -Ivendor \
              -I./raylib-5.5_linux_amd64/include -DPLATFORM_DESKTOP -fopenmp \
              -fPIC -c ocean/rek/binding.c -o /dev/null 2>/dev/null; then
            echo "::warning::-mavx2 no longer fails for aarch64; puffer-cc may be redundant"
          else
            echo "confirmed: -mavx2/-mfma reject the aarch64 target"
          fi

      - name: Compile the training binding through the shim
        env:
          REK_REAL_CC: clang --target=aarch64-linux-gnu --sysroot=/usr/aarch64-linux-gnu
          REK_CC_VERBOSE: '1'
        run: |
          ./ocean/rek/tools/arm64/puffer-cc -O2 -DNDEBUG -mavx2 -mfma \
            -I. -Isrc -Iocean/rek -Ivendor -I./raylib-5.5_linux_amd64/include \
            -DPLATFORM_DESKTOP -fPIC -fopenmp -c ocean/rek/binding.c -o binding_arm64.o
          file binding_arm64.o | grep -q 'ARM aarch64' \
            || { echo "not an aarch64 object"; exit 1; }

      - name: Compile the standalone env through the shim
        env:
          REK_REAL_CC: clang --target=aarch64-linux-gnu --sysroot=/usr/aarch64-linux-gnu
        run: |
          ./ocean/rek/tools/arm64/puffer-cc -O2 -DNDEBUG -mavx2 -mfma \
            -I. -Isrc -Iocean/rek -Ivendor -I./raylib-5.5_linux_amd64/include \
            -DPLATFORM_DESKTOP -c ocean/rek/rek.c -o rek_arm64.o
          file rek_arm64.o | grep -q 'ARM aarch64' \
            || { echo "not an aarch64 object"; exit 1; }
